name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      # Tests & test configs
      - 'spec/**'
      - 'cypress/**'
      - 'app/**/*.test.js'
      - 'app/**/*.test.jsx'
      - 'app/**/__tests__/**'
      - 'app/**/__stories__/**'
      - 'app/**/.storybook/**'
      - 'jest.config.js'
      - 'cypress.config.js'
      - 'cypress.dev.config.js'
      - 'testSetup.js'
      - 'customJsDomEnvironment.js'
      - '.rspec'
      - '.simplecov'
      - 'codecov.yml'
      - 'Guardfile'

      # Documentation & AI context files
      - 'docs/**'
      - '*.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.github/copilot-instructions.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.yardopts'

      # Linting, developer tools & non-deploy CI workflows
      - '.github/workflows/**'
      - '!.github/workflows/cd.yml'
      - '.buildkite/**'
      - 'uffizzi/**'
      - '.rubocop.yml'
      - '.rubocop_todo.yml'
      - '.erb-lint.yml'
      - '.eslintrc.js'
      - '.eslintignore'
      - 'app/**/.eslintrc.js'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.lintstagedrc.js'
      - '.editorconfig'
      - '.solargraph.yml'
      - '.gitpod.yml'
      - '.env_sample'

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: ${{ matrix.environment }}
    environment: ${{ matrix.environment }}

    strategy:
      matrix:
        environment: [ production, staging ]

    steps:
      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh 

      - uses: actions/checkout@v6
      
      - uses: akhileshns/heroku-deploy@v3.15.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
      
      - uses: honeybadger-io/github-notify-deploy-action@v1
        with:
          api_key: ${{ secrets.HONEYBADGER_API_KEY_RUBY }}
        if: matrix.environment == 'production'
      
      - uses: honeybadger-io/github-notify-deploy-action@v1
        with:
          api_key: ${{ secrets.HONEYBADGER_API_KEY_JAVASCRIPT }}
        if: matrix.environment == 'production'
