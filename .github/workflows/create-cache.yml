name: Create CI cache

on:
  push:
    branches:
      - main

jobs:
  build-cache:
    runs-on: ubuntu-latest
    env:
      E2E: true
      RAILS_ENV: test
      NODE_ENV: test
      YARN_ENABLE_HARDENED_MODE: 0

    steps:
      - uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Cache pre-compiled assets
        uses: actions/cache@v6
        id: assetscache
        with:
          path: |
            public/assets
            app/assets/builds
            tmp/cache/assets
          key: ${{ runner.os }}-compiled-assets-v4-${{ hashFiles('app/assets/**', '!app/assets/builds/**', 'app/javascript/**', 'esbuild.config.mjs', '**/package.json', '**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-compiled-assets-v4-
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: yarn
        if: steps.assetscache.outputs.cache-hit != 'true'
      - run: yarn install --immutable
        if: steps.assetscache.outputs.cache-hit != 'true'
      - run: |
          rm -rf public/assets
          SKIP_YARN_INSTALL=true bundle exec rails assets:precompile
        if: steps.assetscache.outputs.cache-hit != 'true'
