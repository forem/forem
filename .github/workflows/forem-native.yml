            an_cm = ["{\"2024-01-01\": 3}"]
            an_rf = ["{\"2024-01-01\": {\"a<b&c>.test\": 5, \"café.dev\": 2}}"]
            raise "Unexpected analytics_aggregate_totals!" unless ForemNative.analytics_aggregate_totals(an_pv, an_rx, an_cm) == [3, 2, 2, 0, 0, 0, 0, 0, 2, 4, 30, 120]
            raise "Unexpected analytics_aggregate_referrers!" unless ForemNative.analytics_aggregate_referrers(an_rf, top: 2) == [["a<b&c>.test", 5], ["café.dev", 2]]
            an_grouped = ForemNative.analytics_aggregate_grouped_by_day(an_pv, an_rx, an_cm, { "2024-01-01" => 1 }, start_iso: "2024-01-01", end_iso: "2024-01-01")
            raise "Unexpected analytics_aggregate_grouped_by_day!" unless an_grouped.is_a?(Hash) && an_grouped["2024-01-01"][:comments][:total] == 3
            an_grouped_json = ForemNative.analytics_grouped_by_day_json(an_pv, an_rx, an_cm, { "2024-01-01" => 1 }, start_iso: "2024-01-01", end_iso: "2024-01-01")
            raise "Unexpected analytics_grouped_by_day_json!" unless an_grouped_json.is_a?(String) && an_grouped_json.include?("\"2024-01-01\":{\"comments\":{\"total\":3}")
            an_dash = ForemNative.analytics_dashboard_json([an_pv, an_rx, an_cm, an_rf], follows_by_iso: { "2024-01-01" => 1 }, follows_total: 1, window: ["2024-01-01", "2024-01-01", false, nil, nil], top_contributors_json: "[]", follower_engagement_json: "{\"total_followers\":1,\"engaged_followers\":0,\"ratio\":0.0}", start_date_floor_iso: "2024-01-01")
            raise "Unexpected analytics_dashboard_json!" unless an_dash.is_a?(String) && an_dash.include?("a\\u003cb\\u0026c\\u003e.test") && an_dash.include?("café.dev")
            spliced_story = ForemNative.splice_stories_feed_item_json("{\"id\":42}", "https://dev.to/a?x=1&y=2", true, 7)
            raise "Unexpected splice_stories_feed_item_json!" unless spliced_story == "{\"id\":42,\"url\":\"https://dev.to/a?x=1\\u0026y=2\",\"current_user_signed_in\":true,\"feed_config\":7}"
            sf_res = ForemNative.serialize_stories_feed_json(["{\"id\":42}", "https://dev.to/a", false, nil], [], [], [], [], [], [], [2026, 0, nil, "cdn-cgi", true, "Some AI", "Auto AI", "No AI", "Not disclosed", false])
            raise "Unexpected serialize_stories_feed_json!" unless sf_res.is_a?(Array) && sf_res[0].start_with?("[{\"id\":42,\"url\":\"https://dev.to/a\"") && sf_res[1] == []
            html_same = "<p>no match</p>"
            raise "Unexpected gsub_literal unchanged!" unless ForemNative.gsub_literal(html_same, "old.cdn", "new.cdn").equal?(html_same)
            raise "Unexpected gsub_literal replaced!" unless ForemNative.gsub_literal("<img src=\"https://old.cdn/a.png\">", "old.cdn", "new.cdn") == "<img src=\"https://new.cdn/a.png\">"
            puts "Successfully loaded precompiled #{RUBY_PLATFORM} (normalized: #{ForemNative::Builder.normalized_platform}) binary!"
          '

  dev-image-load:
    # The jobs above load the binary on ubuntu-24.04 (glibc 2.39).  Contributors on Docker,
    # devcontainer and Codespaces run the pinned development base image (Debian bookworm,
    # glibc 2.36), so check the committed binary loads there too, without cargo, on both architectures.
    name: Committed binary loads in the dev image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Load forem_native in the development base image
        run: scripts/check_forem_native_loads.sh ${{ matrix.arch }}

  build-linux-binaries:
    # Build dev-image-compatible Linux binaries via Containerfile's rust-builder stage so
    # downloadable CI artifacts never link against ubuntu-24.04's newer glibc.
    name: Build dev-image Linux binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            dir: x86_64-linux
            os: ubuntu-24.04
          - arch: arm64
            dir: aarch64-linux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Build forem_native for linux/${{ matrix.arch }}
        run: scripts/build_forem_native_linux.sh ${{ matrix.arch }}
      - name: Upload ${{ matrix.dir }} native binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: forem-native-${{ matrix.dir }}
          path: gems/forem_native/lib/forem_native/${{ matrix.dir }}/forem_native.so
