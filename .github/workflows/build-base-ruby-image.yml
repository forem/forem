---
name: Build ghcr.io/forem/ruby Container Image
on:
  workflow_call:
  # Allow manual runs through GitHub GUI in case of emergency.
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'Containerfile.base'
      - '.ruby-version-next'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'Containerfile.base'
      - '.ruby-version-next'
      - '.github/workflows/build-base-ruby-image.yml'

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Audit this workflow with zizmor
        run: pipx run --spec zizmor==1.32.0 zizmor --offline .github/workflows/build-base-ruby-image.yml
      - name: Skip publishing except on main pushes or manual dispatches
        if: ${{ github.event_name != 'workflow_dispatch' && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
        run: echo "SKIP_PUSH=1" >> $GITHUB_ENV
      - name: Set up QEMU for cross-compiling to ARM64
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Build Images
        env:
          EXTERNAL_QEMU: "1"
        run: scripts/build_base_ruby_image.sh
