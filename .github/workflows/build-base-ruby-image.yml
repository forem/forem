---
name: Build ghcr.io/forem/ruby Container Image
on:
  workflow_call:
  # Allow manual runs through GitHub GUI in case of emergency.
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'Containerfile.base'
      - '.ruby-version-next'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'Containerfile.base'
      - '.ruby-version-next'

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Do not push to GHCR if this commit does not target the main branch
        if: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}
        run: echo "SKIP_PUSH=1" >> $GITHUB_ENV
      - name: Set up QEMU for cross-compiling to ARM64
        run: docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
      - name: Set up Docker BuildX
        run: |
          docker buildx create --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build Images
        env:
          EXTERNAL_QEMU: "1"
        run: scripts/build_base_ruby_image.sh
