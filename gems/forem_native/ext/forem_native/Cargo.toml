[package]
name = "forem_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Magnus Ruby C-ABI bindings for forem_core"
license = "MIT"
publish = false

[lib]
name = "forem_native"
crate-type = ["cdylib"]

[dependencies]
forem_core = { path = "../../crates/forem_core" }
magnus = { version = "0.9", features = ["rb-sys"] }
rb-sys = { version = "0.9", default-features = false }
