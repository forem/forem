    "vars": {
      "BUNDLE_NO_PRUNE": "true",
      "PGGSSENCMODE": "disable",
      "PGHOST": "127.0.0.1",
      "PGUSER": "postgres",
      "WEB_CONCURRENCY": "1"
    },
    "hook": {
      "on-activate": "  # Three ports per checkout, derived from its path so checkouts can run side by\n  # side. They stay below the OS ephemeral ranges (Linux 32768+, macOS 49152+).\n  _crc=\"$(printf '%s' \"$FLOX_ENV_PROJECT\" | cksum | cut -d' ' -f1)\"\n  _base=$((20000 + _crc % 3000 * 4))\n  export PORT=\"${FOREM_PORT:-$_base}\" PGPORT=\"${FOREM_PGPORT:-$((_base + 1))}\" REDIS_PORT=\"${FOREM_REDIS_PORT:-$((_base + 2))}\"\n  unset _crc _base\n  # Exported values win over .env: dotenv-rails never overrides set variables.\n  export APP_DOMAIN=\"localhost:$PORT\"\n  export DATABASE_URL=\"postgresql://127.0.0.1:$PGPORT/Forem_development\"\n  export DATABASE_URL_TEST=\"postgresql://127.0.0.1:$PGPORT/Forem_test\"\n  # Forem defaults each Redis URL to redis://localhost:6379, not to REDIS_URL.\n  export REDIS_URL=\"redis://127.0.0.1:$REDIS_PORT\"\n  export REDIS_SESSIONS_URL=\"$REDIS_URL/1\" REDIS_SIDEKIQ_URL=\"$REDIS_URL/3\" REDIS_RPUSH_URL=\"$REDIS_URL/4\"\n  [ -f \"$FLOX_ENV/lib/locale/locale-archive\" ] && export LOCALE_ARCHIVE=\"$FLOX_ENV/lib/locale/locale-archive\"\n  export PGDATA=\"$FLOX_ENV_CACHE/postgres\"\n  # Gems live in the checkout's cache and only there: a ~/.gem must not leak in.\n  export GEM_HOME=\"$FLOX_ENV_CACHE/gems\" GEM_PATH=\"$FLOX_ENV_CACHE/gems\"\n  export BUNDLE_APP_CONFIG=\"$FLOX_ENV_CACHE/bundle-config\"   # leave .bundle/ alone\n  # The vendored pg gem finds this environment's libpq through pkg-config.\n  case \"$(uname -sm)\" in \"Linux aarch64\") export BUNDLE_BUILD__PG=\"--with-pg-config=ignore\" ;; esac\n  export PATH=\"$FLOX_ENV_PROJECT/.flox/bin:$GEM_HOME/bin:$PATH\"\n  echo \"Forem: http://localhost:$PORT (started by 'flox activate -s')\" >&2\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "js": {
        "command": "exec yarn build --watch",
        "depends-on": {
          "setup": {
            "condition": "process_completed_successfully"
          }
        }
      },
      "postgres": {
        "command": "  [ -s \"$PGDATA/PG_VERSION\" ] || initdb -D \"$PGDATA\" -U \"$PGUSER\" --auth=trust --locale=en_US.UTF-8 -E UTF8\n  # No Unix socket: macOS limits socket paths to 104 bytes. Trust auth is safe\n  # because the server listens on loopback only.\n  exec postgres -D \"$PGDATA\" -c unix_socket_directories= -h 127.0.0.1 -p \"$PGPORT\"\n",
        "shutdown": {
          "signal": 2
        }
      },
      "redis": {
        "command": "  mkdir -p \"$FLOX_ENV_CACHE/redis\"\n  # LC_ALL=C: Redis 7.2 exits if setlocale() fails, and Nix's glibc has no data\n  # for the host's locale.\n  LC_ALL=C exec redis-server --bind 127.0.0.1 --port \"$REDIS_PORT\" --dir \"$FLOX_ENV_CACHE/redis\" --save \"\" --appendonly no\n"
      },
      "setup": {
        "command": "  set -eu\n  cd \"$FLOX_ENV_PROJECT\"\n  # Gemfile.lock names the Bundler it was written with; a newer one rewrites the\n  # committed git gem under vendor/cache. This is the one rubygems.org request.\n  bundler=\"$(awk '/^BUNDLED WITH/ { getline; print $1 }' Gemfile.lock)\"\n  gem list -i bundler -v \"$bundler\" >/dev/null || gem install bundler -v \"$bundler\" --no-document\n  bundle check >/dev/null || bundle install --local --jobs 8 & gems=$!\n  [ node_modules/.yarn-state.yml -nt yarn.lock ] || yarn install --immutable & js=$!\n  wait \"$gems\"; wait \"$js\"\n  [ -n \"$(ls -A app/assets/builds 2>/dev/null)\" ] || yarn build\n  [ -f .env ] || cp .env_sample .env\n  # Only when what the databases depend on changed.\n  stamp=\"$FLOX_ENV_CACHE/databases.stamp\"\n  want=\"$(cat Gemfile.lock yarn.lock db/schema.rb db/seeds.rb | cksum)\"\n  [ \"$(cat \"$stamp\" 2>/dev/null)\" != \"$want\" ] || exit 0\n  until pg_isready -q -p \"$PGPORT\" && redis-cli -p \"$REDIS_PORT\" ping >/dev/null 2>&1; do sleep 0.2; done\n  # db:prepare seeds only a database it creates, and seeding needs node_modules\n  # (done above). A failed seed leaves a database that looks finished, so drop\n  # one we created and let the next run start over.\n  psql -d postgres -tAc \"select 1 from pg_database where datname = 'Forem_development'\" | grep -q 1 && existed=1 || existed=0\n  bin/rails app_initializer:setup forem:setup & dev=$!\n  RAILS_ENV=test bin/rails db:create db:schema:load & test=$!\n  wait \"$test\" || { wait \"$dev\" || true; exit 1; }\n  wait \"$dev\" || { [ \"$existed\" = 1 ] || bin/rails db:drop; exit 1; }\n  echo \"$want\" > \"$stamp\"\n",
        "depends-on": {
          "postgres": {
            "condition": "process_started"
          },
          "redis": {
            "condition": "process_started"
          }
        }
      },
      "sidekiq": {
        "command": "exec bundle exec sidekiq",
        "depends-on": {
          "setup": {
            "condition": "process_completed_successfully"
          }
        }
      },
      "web": {
        "command": "exec bin/rails server -p \"$PORT\" -b 127.0.0.1",
        "depends-on": {
          "setup": {
            "condition": "process_completed_successfully"
          }
        }
      }
    }
  },
