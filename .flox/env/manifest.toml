schema-version = "1.19.0"
# Generated by /floxify

[install]
# ── Ruby and everything Ruby's native gems compile or link against ──────────
# Gemfile line 5 reads .ruby-version verbatim, so Bundler refuses anything but
# exactly 3.3.0. That exact patch lives in an early-2024 catalog snapshot, so
# this group carries the libraries native gems link against alongside it
# (pg → libpq, ruby-vips → libvips, psych → libyaml), keeping them ABI-coherent.
ruby.pkg-path = "ruby_3_3"
ruby.version = "3.3.0"          # ← .ruby-version, Gemfile.lock RUBY VERSION
ruby.pkg-group = "ruby"
# Postgres 13 ← .mise.toml (13.12) and docker-compose (pgvector/pgvector:pg13).
# db/schema.rb enables the `vector` extension, so pgvector ships with it.
# 2026-11-17: in the "ruby" group these resolved to the early-2024 snapshot
# (postgres 13.14, pgvector 0.6.2) and CREATE EXTENSION vector failed — that
# build looks for vector.so in its own lib output, not the environment. In
# their own group they resolve current (13.23 / 0.8.1) and the extension loads.
# The pg gem ships prebuilt with its own libpq, so nothing ABI-links to them.
postgresql.pkg-path = "postgresql_13"
postgresql.pkg-group = "postgres"
# The pg gem ships prebuilt for macOS and x86_64 Linux; aarch64-linux compiles
# it and needs pg_config and libpq headers from the dev output.
postgresql.outputs = ["out", "lib", "dev"]
pgvector.pkg-path = "postgresql13Packages.pgvector"
pgvector.pkg-group = "postgres"
redis.pkg-path = "redis"         # ← .mise.toml 6.0.9 / docker-compose 7.0; unpinned
redis.pkg-group = "ruby"
# ruby-vips loads libvips at runtime; its `out` output (the shared library) is
# not installed by default. mini_magick shells out to ImageMagick.
vips.pkg-path = "vips"
vips.outputs = ["bin", "out"]
vips.pkg-group = "ruby"
imagemagick.pkg-path = "imagemagick"
imagemagick.pkg-group = "ruby"
libyaml.pkg-path = "libyaml"
libyaml.outputs = ["out", "dev"]
libyaml.pkg-group = "ruby"
# The openssl gem (via rpush → web-push) compiles against OpenSSL headers.
openssl.pkg-path = "openssl"
openssl.outputs = ["out", "dev"]
openssl.pkg-group = "ruby"
pkg-config.pkg-path = "pkg-config"
pkg-config.pkg-group = "ruby"
# Linux has no guaranteed system compiler for native gems (bcrypt, oj, puma,
# sassc, redcarpet, …). macOS uses the Xcode command-line tools.
gcc.pkg-path = "gcc"
gcc.pkg-group = "ruby"
gcc.systems = ["aarch64-linux", "x86_64-linux"]
# gems/forem_native commits prebuilt binaries for arm64-darwin, x86_64-darwin
# and x86_64-linux. Only aarch64-linux has to compile it, so Rust is scoped there.
cargo.pkg-path = "cargo"
cargo.pkg-group = "rust"
cargo.systems = ["aarch64-linux"]
rustc.pkg-path = "rustc"
rustc.pkg-group = "rust"
rustc.systems = ["aarch64-linux"]

# ── JavaScript toolchain ─────────────────────────────────────────────────────
# No native linkage to the Ruby group, so it resolves from the current catalog.
nodejs.pkg-path = "nodejs_22"
nodejs.version = "22.23.4"       # ← .nvmrc, engines.node ">=22.23.4 <23"
nodejs.pkg-group = "node"
# .yarnrc.yml sets yarnPath to .yarn/releases/yarn-4.1.0.cjs, so any yarn
# binary delegates to the committed 4.1.0. Classic yarn matches .mise.toml.
yarn.pkg-path = "yarn"
yarn.pkg-group = "node"

[vars]
PGPORT = "5432"
PGUSER = "postgres"
# Same values .env_sample ships, so a .env copied by bin/setup agrees with them.
DATABASE_URL = "postgresql://localhost:5432/Forem_development"
DATABASE_URL_TEST = "postgresql://localhost:5432/Forem_test"
REDIS_URL = "redis://localhost:6379"
# macOS: Puma forks workers (WEB_CONCURRENCY=2), and libpq's GSSAPI probe is not
# fork-safe there — every request segfaulted in PG::Connection#connect_start
# until this was set. Local dev has no Kerberos, so disabling it costs nothing.
PGGSSENCMODE = "disable"

[hook]
on-activate = '''
  # Gems (and foreman, which bin/dev installs) go to the Flox cache, never to
  # the read-only Ruby install or ~/.gem.
  export GEM_HOME="$FLOX_ENV_CACHE/gems"
  export PATH="$GEM_HOME/bin:$PATH"
  export PGDATA="$FLOX_ENV_CACHE/postgres"
  export FOREM_PGSOCKET="$FLOX_ENV_CACHE/pgsock"
  mkdir -p "$GEM_HOME" "$FOREM_PGSOCKET" "$FLOX_ENV_CACHE/redis"

  if [ ! -d "$PGDATA" ]; then
    echo "→ initializing PostgreSQL 13 cluster" >&2
    initdb -D "$PGDATA" --username="$PGUSER" --auth=trust --no-locale --encoding=UTF8 >&2
  fi

  cd "$FLOX_ENV_PROJECT"
  if ! bundle check >/dev/null 2>&1; then
    echo "→ bundle install (first run compiles native gems — several minutes)" >&2
    BUNDLE_JOBS=8 bundle install >&2   # env var, so nothing is written to .bundle/config
  fi

  if [ ! -d node_modules ] || [ yarn.lock -nt node_modules ]; then
    echo "→ yarn install" >&2
    yarn install --immutable >&2 && touch node_modules
  fi

  if [ ! -f "$FLOX_ENV_CACHE/.seeded" ]; then
    echo "" >&2
    echo "Next: flox services start   (if you didn't use 'flox activate -s')" >&2
    echo "      bin/setup && touch \"\$FLOX_ENV_CACHE/.seeded\"   # creates, migrates and seeds the database" >&2
    echo "      bin/dev                                          # web, sidekiq, js watcher → http://localhost:3000" >&2
  fi
'''

# TCP exception (recorded): .env_sample — which bin/setup copies to .env —
# hard-codes DATABASE_URL=postgresql://localhost:5432/..., and bin/dev runs
# foreman, which loads .env over the shell environment. A socket-only server
# would be unreachable through that path, so loopback TCP is served alongside
# the unix socket. Cost: one Forem checkout at a time can run on 5432.
[services.postgres]
command = '''
  exec postgres -D "$FLOX_ENV_CACHE/postgres" \
    -k "$FLOX_ENV_CACHE/pgsock" \
    -h 127.0.0.1 -p "$PGPORT"
'''

[services.redis]
command = '''
  exec redis-server --port 6379 \
    --unixsocket "$FLOX_ENV_CACHE/redis/forem-redis.sock" \
    --dir "$FLOX_ENV_CACHE/redis" --save "" --appendonly no
'''

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
