schema-version = "1.19.0"
# One `flox activate -s` takes a fresh clone to a running, seeded Forem.
# Guide: docs/flox.md. A "pkg-group" pins its packages to one snapshot of the
# package catalog; an "output" is one slice of a package (`out` = libraries and
# binaries, `dev` = headers and pkg-config files).

[install]
# Gemfile reads .ruby-version verbatim and the Flox catalog stops at ruby_3_3
# 3.3.12, so Ruby comes from `flox/ruby_3_3`, which tracks 3.3 security releases.
# On Linux it compiles native gems with the gcc it was built with; on macOS it
# has no compiler in its closure (42 MiB, not ~800 MiB). Switch back
# to the catalog's `ruby_3_3` with `ruby.version` = .ruby-version once
# `flox show ruby_3_3` lists it. Ruby 3.3 reaches end of support at the end of
# March 2027. Own group: a `flox` catalog package cannot share one with nixpkgs.
ruby.pkg-path = "flox/ruby_3_3"
ruby.pkg-group = "ruby"

# What native gems link against; the openssl and psych gems override Ruby's own.
libyaml.pkg-path = "libyaml"
libyaml.outputs = ["out", "dev"]
openssl.pkg-path = "openssl"
openssl.outputs = ["out", "dev"]
pkg-config.pkg-path = "pkg-config"
pkg-config.outputs = ["out"]
# The zlib gem compiles against it; Nix's Apple SDK has no zlib.h.
zlib.pkg-path = "zlib"
zlib.outputs = ["out", "dev"]
# mkmf runs `make`; a minimal Linux install may not have it, and macOS's is a
# Command Line Tools shim.
gnumake.pkg-path = "gnumake"
# macOS only: Ruby's rbconfig names a bare `clang`, so native gems compile with
# this one and need no Command Line Tools, for ~256 MB more download. Delete
# these two lines (and run `xcode-select --install`) to use Apple's instead.
clang.pkg-path = "clang"
clang.systems = ["aarch64-darwin"]

# docker-compose.yml and CI run Redis 7; 7.x only exists in an older snapshot,
# so its own group keeps the others current.
redis.pkg-path = "redis"
redis.version = "7.2"
redis.pkg-group = "redis"

# PostgreSQL 13 (docker-compose.yml, CI) left nixpkgs after end of life, so it
# lives in a late-2025 snapshot, and pgvector (0.8.0+, README.md) must come from
# the same one or the server fails with `could not access file "$libdir/vector"`.
# `out` only: the pg gem is prebuilt for arm64-darwin and x86_64-linux, and the
# `dev` output alone pulled ~300 MB of toolchain.
postgresql.pkg-path = "postgresql_13"
postgresql.outputs = ["out"]
postgresql.pkg-group = "postgres"
pgvector.pkg-path = "postgresql13Packages.pgvector"
pgvector.pkg-group = "postgres"
# aarch64-linux has no prebuilt pg gem and compiles against libpq.
libpq.pkg-path = "libpq"
libpq.outputs = ["out", "dev"]
libpq.systems = ["aarch64-linux"]
libpq.pkg-group = "postgres"
# initdb needs the en_US.UTF-8 collation: db/schema.rb was written in that index
# order, and a cluster in the "C" locale makes migrations rewrite it. Nix's glibc
# on Linux ships no locales; macOS has them.
glibcLocalesUtf8.pkg-path = "glibcLocalesUtf8"
glibcLocalesUtf8.pkg-group = "postgres"
glibcLocalesUtf8.systems = ["aarch64-linux", "x86_64-linux"]

# Version from .nvmrc and package.json `engines`; change all three together.
# Yarn is the release committed at .yarnrc.yml's yarnPath, run by .flox/bin/yarn
# (the catalog's yarn brings a second, newer Node).
nodejs.pkg-path = "nodejs_22"
nodejs.version = "22.23.4"
nodejs.pkg-group = "node"

[vars]
PGUSER = "postgres"
PGHOST = "127.0.0.1"
# libpq's GSSAPI probe is not fork-safe on macOS; without this every request
# crashes in PG::Connection#connect_start once Puma has forked.
PGGSSENCMODE = "disable"
# Bundler would otherwise delete vendor/cache gems it considers unused.
BUNDLE_NO_PRUNE = "true"
# What docker-compose.yml uses in development; Puma's cluster mode takes ~25 s
# to shut down.
WEB_CONCURRENCY = "1"

[hook]
on-activate = '''
  # Three ports per checkout, derived from its path so checkouts can run side by
  # side. They stay below the OS ephemeral ranges (Linux 32768+, macOS 49152+).
  _crc="$(printf '%s' "$FLOX_ENV_PROJECT" | cksum | cut -d' ' -f1)"
  _base=$((20000 + _crc % 3000 * 4))
  export PORT="${FOREM_PORT:-$_base}" PGPORT="${FOREM_PGPORT:-$((_base + 1))}" REDIS_PORT="${FOREM_REDIS_PORT:-$((_base + 2))}"
  unset _crc _base
  # Exported values win over .env: dotenv-rails never overrides set variables.
  export APP_DOMAIN="localhost:$PORT"
  export DATABASE_URL="postgresql://127.0.0.1:$PGPORT/Forem_development"
  export DATABASE_URL_TEST="postgresql://127.0.0.1:$PGPORT/Forem_test"
  # Forem defaults each Redis URL to redis://localhost:6379, not to REDIS_URL.
  export REDIS_URL="redis://127.0.0.1:$REDIS_PORT"
  export REDIS_SESSIONS_URL="$REDIS_URL/1" REDIS_SIDEKIQ_URL="$REDIS_URL/3" REDIS_RPUSH_URL="$REDIS_URL/4"
  [ -f "$FLOX_ENV/lib/locale/locale-archive" ] && export LOCALE_ARCHIVE="$FLOX_ENV/lib/locale/locale-archive"
  export PGDATA="$FLOX_ENV_CACHE/postgres"
  # Gems live in the checkout's cache and only there: a ~/.gem must not leak in.
  export GEM_HOME="$FLOX_ENV_CACHE/gems" GEM_PATH="$FLOX_ENV_CACHE/gems"
  export BUNDLE_APP_CONFIG="$FLOX_ENV_CACHE/bundle-config"   # leave .bundle/ alone
  # The vendored pg gem finds this environment's libpq through pkg-config.
  case "$(uname -sm)" in "Linux aarch64") export BUNDLE_BUILD__PG="--with-pg-config=ignore" ;; esac
  export PATH="$FLOX_ENV_PROJECT/.flox/bin:$GEM_HOME/bin:$PATH"
  echo "Forem: http://localhost:$PORT (started by 'flox activate -s')" >&2
'''

# `setup` installs gems and JavaScript packages and prepares the databases; web,
# sidekiq and js wait for it. Failure shows as `setup Completed (1)` in
# `flox services status`; read it with `flox services logs setup`.
[services.setup]
command = '''
  set -eu
  cd "$FLOX_ENV_PROJECT"
  # Gemfile.lock names the Bundler it was written with; a newer one rewrites the
  # committed git gem under vendor/cache. This is the one rubygems.org request.
  bundler="$(awk '/^BUNDLED WITH/ { getline; print $1 }' Gemfile.lock)"
  gem list -i bundler -v "$bundler" >/dev/null || gem install bundler -v "$bundler" --no-document
  bundle check >/dev/null || bundle install --local --jobs 8 & gems=$!
  [ node_modules/.yarn-state.yml -nt yarn.lock ] || yarn install --immutable & js=$!
  wait "$gems"; wait "$js"
  [ -n "$(ls -A app/assets/builds 2>/dev/null)" ] || yarn build
  [ -f .env ] || cp .env_sample .env
  # `process_started` does not mean ready, and a service that died on start
  # (a port conflict) would otherwise leave this waiting forever.
  deadline=$(($(date +%s) + 60))
  until pg_isready -q -p "$PGPORT" && redis-cli -p "$REDIS_PORT" ping >/dev/null 2>&1; do
    [ "$(date +%s)" -lt "$deadline" ] || { echo "setup: PostgreSQL (port $PGPORT) or Redis (port $REDIS_PORT) not accepting connections after 60 s; see 'flox services logs postgres' and 'flox services logs redis'" >&2; exit 1; }
    sleep 0.2
  done
  # Another server on this port passes the check above; leave its databases alone.
  [ "$(psql -X -d postgres -tAc 'show data_directory')" = "$PGDATA" ] || { echo "setup: the PostgreSQL on port $PGPORT is not this checkout's ($PGDATA)" >&2; exit 1; }
  # Only when what the databases depend on changed.
  stamp="$FLOX_ENV_CACHE/databases.stamp"
  want="$(cat Gemfile.lock yarn.lock db/schema.rb db/seeds.rb | cksum)"
  [ "$(cat "$stamp" 2>/dev/null)" != "$want" ] || exit 0
  rm -f "$stamp"
  # db:prepare seeds only a database it creates, so one left unseeded by a failed
  # or killed run looks finished to the next. `creating` marks a development
  # database this setup created and has not finished seeding; the next run drops
  # it. A database that predates setup is never marked, so never dropped.
  creating="$FLOX_ENV_CACHE/databases.creating"
  if [ -e "$creating" ]; then
    # One connection checks the server is this checkout's and then drops, so
    # the check and the drop cannot reach different servers.
    psql -X -q -v ON_ERROR_STOP=1 -d postgres -o /dev/null \
      -c "select 1/(current_setting('data_directory') = '$PGDATA')::int" \
      -c 'drop database if exists "Forem_development" with (force)'
    existed=
  else
    existed="$(psql -X -v ON_ERROR_STOP=1 -d postgres -tAc "select 1 from pg_database where datname = 'Forem_development'")"
  fi
  [ -n "$existed" ] || touch "$creating"
  bin/rails app_initializer:setup forem:setup & dev=$!
  RAILS_ENV=test bin/rails db:create db:schema:load & test=$!
  failed=0
  wait "$dev" && rm -f "$creating" || failed=1
  wait "$test" || failed=1
  [ "$failed" = 0 ] || exit 1
  echo "$want" > "$stamp"
'''
depends-on.postgres = { condition = "process_started" }
depends-on.redis = { condition = "process_started" }

[services.postgres]
command = '''
  [ -s "$PGDATA/PG_VERSION" ] || initdb -D "$PGDATA" -U "$PGUSER" --auth=trust --locale=en_US.UTF-8 -E UTF8
  # No Unix socket: macOS limits socket paths to 104 bytes. Trust auth lets every
  # local user connect as postgres, so this assumes a single-user workstation or
  # isolated VM; loopback does not separate users on a shared host.
  exec postgres -D "$PGDATA" -c unix_socket_directories= -h 127.0.0.1 -p "$PGPORT"
'''
shutdown.signal = 2   # SIGINT: fast shutdown

[services.redis]
command = '''
  mkdir -p "$FLOX_ENV_CACHE/redis"
  # LC_ALL=C: Redis 7.2 exits if setlocale() fails, and Nix's glibc has no data
  # for the host's locale.
  LC_ALL=C exec redis-server --bind 127.0.0.1 --port "$REDIS_PORT" --dir "$FLOX_ENV_CACHE/redis" --save "" --appendonly no
'''

[services.web]
command = 'exec bin/rails server -p "$PORT" -b 127.0.0.1'
depends-on.setup = { condition = "process_completed_successfully" }

[services.sidekiq]
command = 'exec bundle exec sidekiq'
depends-on.setup = { condition = "process_completed_successfully" }

[services.js]
command = 'exec yarn build --watch'
depends-on.setup = { condition = "process_completed_successfully" }

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
