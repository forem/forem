schema-version = "1.19.0"
# Option 3 ("forem-fast"): a Flox environment tuned for time-to-contributor.
#
# Compared with the first floxified environment (justincastilla/forem 641f8b9;
# main has since taken the same package cuts):
#   * about half the download on aarch64-darwin (285 MB vs 621 MB), by
#     dropping three things that pulled in whole extra toolchains:
#       - postgresql `dev`  -> LLVM 20 + 21, Clang 21, apple-sdk 14.4, Python 3.13
#       - catalog `yarn`    -> a second Node (24) just to start Yarn
#       - vips `bin`        -> Python 3.11 + pycairo for the vipsprofile script
#   * first activation installs gems, JS packages and both databases in
#     parallel lanes (.flox/bin/forem-bootstrap) instead of one after another;
#   * gems install offline from Forem's committed vendor/cache into a cache
#     shared by every checkout that uses the same Ruby store path, so a second
#     clone or worktree skips native-gem compiles entirely;
#   * per-checkout ports so several checkouts can run at once.

[install]
# -- Ruby and what its native gems link against -------------------------------
# Gemfile line 5 reads .ruby-version verbatim, so Bundler wants exactly 3.3.0,
# which lives in an early-2024 catalog snapshot. The libraries native gems
# compile against share that group so they stay ABI-coherent with Ruby.
ruby.pkg-path = "ruby_3_3"
ruby.version = "3.3.0"
ruby.pkg-group = "ruby"
redis.pkg-path = "redis"
redis.pkg-group = "ruby"
# ruby-vips dlopens libvips (the `out` output). The `bin` output only adds the
# vips CLI and vipsprofile, which drags in a Python 3.11 closure.
vips.pkg-path = "vips"
vips.outputs = ["out"]
vips.pkg-group = "ruby"
imagemagick.pkg-path = "imagemagick"
imagemagick.pkg-group = "ruby"
libyaml.pkg-path = "libyaml"
libyaml.outputs = ["out", "dev"]
libyaml.pkg-group = "ruby"
openssl.pkg-path = "openssl"
openssl.outputs = ["out", "dev"]
openssl.pkg-group = "ruby"
# The zlib gem (via metainspector -> faraday-gzip) compiles against zlib.
# macOS gets it from the SDK; Linux runners have no headers or -lz to offer.
zlib.pkg-path = "zlib"
zlib.outputs = ["out", "dev"]
zlib.pkg-group = "ruby"
zlib.systems = ["aarch64-linux", "x86_64-linux"]
pkg-config.pkg-path = "pkg-config"
pkg-config.pkg-group = "ruby"
gcc.pkg-path = "gcc"
gcc.pkg-group = "ruby"
gcc.systems = ["aarch64-linux", "x86_64-linux"]
cargo.pkg-path = "cargo"
cargo.pkg-group = "rust"
cargo.systems = ["aarch64-linux"]
rustc.pkg-path = "rustc"
rustc.pkg-group = "rust"
rustc.systems = ["aarch64-linux"]

# -- PostgreSQL 13 + pgvector ---------------------------------------------------
# Version from .mise.toml and docker-compose (pgvector/pgvector:pg13).
# Only `out`: the pg gem ships prebuilt (with its own libpq) for arm64-darwin,
# x86_64-darwin and x86_64-linux, so pg_config and headers are dead weight
# there, and the `dev` output alone pulled ~300 MB of compressed toolchain.
# aarch64-linux has to compile the pg gem, so it alone gets libpq headers.
postgresql.pkg-path = "postgresql_13"
postgresql.outputs = ["out"]
postgresql.pkg-group = "postgres"
pgvector.pkg-path = "postgresql13Packages.pgvector"
pgvector.pkg-group = "postgres"
libpq.pkg-path = "libpq"
libpq.outputs = ["out", "dev"]
libpq.systems = ["aarch64-linux"]
libpq.pkg-group = "postgres"

# -- JavaScript -------------------------------------------------------------------
# No Yarn package: .yarnrc.yml pins yarnPath to the committed
# .yarn/releases/yarn-4.1.0.cjs, so .flox/bin/yarn runs that with this Node.
nodejs.pkg-path = "nodejs_22"
nodejs.version = "22.23.4"       # <- .nvmrc, engines.node ">=22.23.4 <23"
nodejs.pkg-group = "node"

[vars]
PGUSER = "postgres"
# libpq's GSSAPI probe is not fork-safe on macOS; Puma forks workers.
PGGSSENCMODE = "disable"
# Bundler re-caches into vendor/cache whenever that directory exists, and by
# default deletes the gems it doesn't need, which dirties a committed tree
# (6 stale .gem files today). Don't prune.
BUNDLE_NO_PRUNE = "true"

[hook]
on-activate = '''
  # -- Per-checkout ports (4 consecutive ports derived from the path) --------
  _crc="$(printf '%s' "$FLOX_ENV_PROJECT" | cksum | awk '{print $1}')"
  _base="$((20000 + (_crc % 9000) * 4))"
  export PORT="${FOREM_PORT:-$_base}"
  export PGPORT="${FOREM_PGPORT:-$((_base + 1))}"
  export REDIS_PORT="${FOREM_REDIS_PORT:-$((_base + 2))}"
  unset _crc _base

  # Exported values win over .env: dotenv-rails never overrides set variables.
  export APP_DOMAIN="localhost:$PORT"
  export DATABASE_URL="postgresql://127.0.0.1:$PGPORT/Forem_development"
  export DATABASE_URL_TEST="postgresql://127.0.0.1:$PGPORT/Forem_test"
  export REDIS_URL="redis://127.0.0.1:$REDIS_PORT"
  export REDIS_SESSIONS_URL="$REDIS_URL/1"
  export REDIS_SIDEKIQ_URL="$REDIS_URL/3"
  export REDIS_RPUSH_URL="$REDIS_URL/4"

  export PGDATA="$FLOX_ENV_CACHE/postgres"
  export FOREM_PGSOCKET="$FLOX_ENV_CACHE/pgsock"
  export FOREM_REDIS_DIR="$FLOX_ENV_CACHE/redis"

  # -- Gems: one compiled-gem cache per Ruby build, shared across checkouts --
  # Keyed by Ruby's store path, so a different Ruby (or system) never reuses
  # extensions built for another ABI. FOREM_SHARED_GEMS=0 keeps them local.
  _ruby="$(basename "$(dirname "$(dirname "$(realpath "$FLOX_ENV/bin/ruby")")")")"
  if [ "${FOREM_SHARED_GEMS:-1}" = 1 ]; then
    export GEM_HOME="${XDG_CACHE_HOME:-$HOME/.cache}/forem-flox/gems/$_ruby"
  else
    export GEM_HOME="$FLOX_ENV_CACHE/gems"
  fi
  unset _ruby
  export BUNDLE_APP_CONFIG="$FLOX_ENV_CACHE/bundle-config"   # leave .bundle/ alone
  # aarch64-linux compiles the pg gem. pg_config --libs adds -lgssapi_krb5
  # etc., which end up as direct NEEDED entries of pg_ext.so with no RUNPATH
  # to find them at load time. libpq already carries its own RUNPATH to
  # Kerberos, so link with --as-needed and keep only the libpq dependency.
  case "$(uname -sm)" in
    "Linux aarch64") export BUNDLE_BUILD__PG="--with-ldflags=-Wl,--as-needed" ;;
  esac
  export PATH="$FLOX_ENV_PROJECT/.flox/bin:$GEM_HOME/bin:$PATH"

  mkdir -p "$GEM_HOME" "$BUNDLE_APP_CONFIG" "$FOREM_PGSOCKET" "$FOREM_REDIS_DIR"

  # -- First activation (or a changed lockfile/schema): parallel bootstrap ---
  # Returns almost immediately when nothing changed.
  if [ "${FOREM_BOOTSTRAP:-1}" = 1 ]; then
    "$FLOX_ENV_PROJECT/.flox/bin/forem-bootstrap" --if-needed >&2 || \
      echo "forem-bootstrap failed; logs in $FLOX_ENV_CACHE/bootstrap/" >&2
  fi
'''

[services.postgres]
command = '''
  exec postgres -D "$PGDATA" -k "$FOREM_PGSOCKET" -h 127.0.0.1 -p "$PGPORT"
'''

[services.redis]
command = '''
  exec redis-server --bind 127.0.0.1 --port "$REDIS_PORT" --dir "$FOREM_REDIS_DIR" \
    --save "" --appendonly no
'''

[services.web]
command = '''
  cd "$FLOX_ENV_PROJECT" && exec bin/rails server -p "$PORT" -b 127.0.0.1
'''

[services.sidekiq]
command = '''
  cd "$FLOX_ENV_PROJECT" && exec bundle exec sidekiq
'''

[services.js]
command = '''
  cd "$FLOX_ENV_PROJECT" && exec yarn build --watch
'''

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
