schema-version = "1.19.0"
# Flox environment for contributing to Forem: one `flox activate -s` takes a
# fresh clone to a running, seeded app. See docs/flox.md for the contributor
# guide; this file explains why each choice below was made.
#
# Nix vocabulary used here, for readers who have not met it:
#   * a "store path" is an immutable, hash-named directory under /nix/store;
#     every package version lives in its own, so nothing here touches the
#     system's Ruby, Node, Postgres or Redis;
#   * an "output" is one slice of a package (`out` = runtime files, `dev` =
#     headers); installing only the outputs you need keeps downloads small;
#   * a "pkg-group" pins packages to one snapshot of the package catalog.
#     Packages in different groups can be at different snapshots.

[install]
# -- Ruby -------------------------------------------------------------------
# Gemfile line 5 reads .ruby-version verbatim, so Bundler wants exactly that
# Ruby (3.3.14 today). The Flox base catalog stops at ruby_3_3 3.3.12, so Ruby
# comes from the `flox/ruby_3_3` package, which tracks the 3.3 security
# releases and, unlike the nixpkgs build, carries no compiler in its closure
# (42 MiB instead of ~300 MiB).
#
# SWITCH BACK to the catalog's `ruby_3_3` (`ruby.pkg-path = "ruby_3_3"` plus
# `ruby.version` = the contents of .ruby-version) once `flox show ruby_3_3`
# lists that version. Ruby 3.3 reaches end of support at the end of March
# 2027, after which this line moves to the Ruby series .ruby-version names.
#
# PENDING: `flox/ruby_3_3` is not published yet, so this file still names the
# catalog Ruby, which is too old for .ruby-version. Replace the next line
# with `ruby.pkg-path = "flox/ruby_3_3"`, run `flox lock-manifest` (or just
# `flox activate`) and commit .flox/env/manifest.lock.
ruby.pkg-path = "ruby_3_3"

# -- What native gems link against --------------------------------------------
# Only the `out` (libraries) and `dev` (headers, pkg-config files) outputs;
# the default outputs add binaries and docs nothing uses.
# The `openssl` and `psych` gems in Gemfile.lock override the ones bundled with
# Ruby and compile against these.
libyaml.pkg-path = "libyaml"
libyaml.outputs = ["out", "dev"]
openssl.pkg-path = "openssl"
openssl.outputs = ["out", "dev"]
# Native gems find the two libraries above through pkg-config.
pkg-config.pkg-path = "pkg-config"
pkg-config.outputs = ["out"]
# Linux only. The zlib gem (via metainspector -> faraday-gzip) compiles against
# zlib. macOS gets it from the SDK; Linux has no headers to offer.
zlib.pkg-path = "zlib"
zlib.outputs = ["out", "dev"]
zlib.systems = ["aarch64-linux", "x86_64-linux"]
# Linux only. Ruby's closure holds no compiler, so gem builds use this one. On
# macOS they use the Xcode Command Line Tools compiler; see docs/flox.md.
gcc.pkg-path = "gcc"
gcc.outputs = ["out"]
gcc.systems = ["aarch64-linux", "x86_64-linux"]

# -- Redis ----------------------------------------------------------------------
# docker-compose.yml and CI run Redis 7. Its own pkg-group because 7.x only
# exists in an older catalog snapshot, and a group shares one snapshot: without
# the split every other package here would be dragged back to it.
redis.pkg-path = "redis"
redis.version = "^7"
redis.pkg-group = "redis"

# -- PostgreSQL 13 + pgvector ---------------------------------------------------
# Version from docker-compose.yml and CI (pgvector/pgvector:pg13). Own group
# because PostgreSQL 13 left nixpkgs after its end of life, so it only exists
# in a late-2025 snapshot. pgvector must come from the same snapshot: the
# extension is found through the server's own install tree, and an older
# pgvector fails with `could not access file "$libdir/vector"`. Forem needs
# pgvector 0.8.0 or newer (README.md).
# Only `out`: the pg gem ships prebuilt (with its own libpq) for arm64-darwin,
# x86_64-darwin and x86_64-linux, so headers and pg_config are dead weight
# there, and the `dev` output alone pulled ~300 MB of toolchain.
postgresql.pkg-path = "postgresql_13"
postgresql.outputs = ["out"]
postgresql.pkg-group = "postgres"
pgvector.pkg-path = "postgresql13Packages.pgvector"
pgvector.pkg-group = "postgres"
# aarch64-linux has no prebuilt pg gem in vendor/cache, so it compiles against
# libpq. See the BUNDLE_BUILD__PG note in the hook.
libpq.pkg-path = "libpq"
libpq.outputs = ["out", "dev"]
libpq.systems = ["aarch64-linux"]
libpq.pkg-group = "postgres"

# Linux only: initdb creates the cluster with the en_US.UTF-8 collation, because
# Rails writes db/schema.rb with indexes in the database's sort order and the
# committed file was generated under en_US. A cluster in the "C" locale reorders
# index lines, so running a migration (or `bin/rails db:reset`) would show
# spurious schema.rb changes in a contributor's diff. macOS ships the locale;
# Nix's glibc on Linux has none, so it comes from here, from the snapshot whose
# glibc Postgres uses.
glibcLocalesUtf8.pkg-path = "glibcLocalesUtf8"
glibcLocalesUtf8.pkg-group = "postgres"
glibcLocalesUtf8.systems = ["aarch64-linux", "x86_64-linux"]

# -- JavaScript -----------------------------------------------------------------
# Version from .nvmrc and package.json `engines`. Update both together. There
# is no Yarn package: .yarnrc.yml pins yarnPath to the committed
# .yarn/releases/yarn-4.1.0.cjs, so .flox/bin/yarn runs that with this Node (the
# catalog's `yarn` brings along a second, newer Node).
nodejs.pkg-path = "nodejs_22"
nodejs.version = "22.23.4"
nodejs.pkg-group = "node"

[vars]
PGUSER = "postgres"
# Connect over TCP, never a Unix socket: the Postgres service has its socket
# turned off (see services.postgres).
PGHOST = "127.0.0.1"
# libpq's GSSAPI probe is not fork-safe on macOS and Puma forks workers; without
# this every web request crashes in PG::Connection#connect_start.
PGGSSENCMODE = "disable"
# Bundler re-caches into vendor/cache whenever that directory exists, and by
# default deletes the gems it does not need, which dirties a committed tree
# (six stale .gem files today). Do not prune.
BUNDLE_NO_PRUNE = "true"

[hook]
on-activate = '''
  # -- Per-checkout ports (4 consecutive ports derived from the path) --------
  # Two checkouts hash to different ports, so they can run side by side.
  # Override any of these before activating: FOREM_PORT, FOREM_PGPORT,
  # FOREM_REDIS_PORT.
  _crc="$(printf '%s' "$FLOX_ENV_PROJECT" | cksum | awk '{print $1}')"
  _base="$((20000 + (_crc % 9000) * 4))"
  export PORT="${FOREM_PORT:-$_base}"
  export PGPORT="${FOREM_PGPORT:-$((_base + 1))}"
  export REDIS_PORT="${FOREM_REDIS_PORT:-$((_base + 2))}"
  unset _crc _base

  # Exported values win over .env: dotenv-rails never overrides set variables.
  export APP_DOMAIN="localhost:$PORT"
  export DATABASE_URL="postgresql://127.0.0.1:$PGPORT/Forem_development"
  export DATABASE_URL_TEST="postgresql://127.0.0.1:$PGPORT/Forem_test"
  export REDIS_URL="redis://127.0.0.1:$REDIS_PORT"
  export REDIS_SESSIONS_URL="$REDIS_URL/1"
  export REDIS_SIDEKIQ_URL="$REDIS_URL/3"
  export REDIS_RPUSH_URL="$REDIS_URL/4"

  # Nix's glibc finds locales through this archive rather than the host's.
  [ -f "$FLOX_ENV/lib/locale/locale-archive" ] && export LOCALE_ARCHIVE="$FLOX_ENV/lib/locale/locale-archive"

  export PGDATA="$FLOX_ENV_CACHE/postgres"
  export FOREM_REDIS_DIR="$FLOX_ENV_CACHE/redis"
  # No Unix socket: macOS limits socket paths to 104 bytes, which a checkout
  # nested a few directories deep can exceed. Shared by the service and bootstrap.
  export FOREM_PG_ARGS="-c unix_socket_directories= -h 127.0.0.1 -p $PGPORT"

  # -- Gems: one compiled-gem cache per Ruby build, shared across checkouts --
  # Keyed by Ruby's store path, so a different Ruby (or system) never reuses
  # extensions built for another ABI. FOREM_SHARED_GEMS=0 keeps them local.
  _ruby="$(basename "$(dirname "$(dirname "$(realpath "$FLOX_ENV/bin/ruby")")")")"
  if [ "${FOREM_SHARED_GEMS:-1}" = 1 ]; then
    export GEM_HOME="${XDG_CACHE_HOME:-$HOME/.cache}/forem-flox/gems/$_ruby"
  else
    export GEM_HOME="$FLOX_ENV_CACHE/gems"
  fi
  unset _ruby
  # Gems come from GEM_HOME only; a ~/.gem or ~/.local/share/gem directory the
  # contributor already has must not leak into Forem's load path.
  export GEM_PATH="$GEM_HOME"
  export BUNDLE_APP_CONFIG="$FLOX_ENV_CACHE/bundle-config"   # leave .bundle/ alone
  # aarch64-linux compiles the pg gem. Point it at this environment's libpq
  # (forem-pg-config), not whatever pg_config the host has on PATH, and link
  # with --as-needed so libpq (which has its own RUNPATH to Kerberos) is the
  # only direct dependency. Without this the gem linked the host's libpq and
  # failed to load with `libgssapi_krb5.so.2: cannot open shared object file`.
  case "$(uname -sm)" in
    "Linux aarch64")
      export BUNDLE_BUILD__PG="--with-pg-config=$FLOX_ENV_PROJECT/.flox/bin/forem-pg-config --with-ldflags=-Wl,--as-needed" ;;
  esac
  export PATH="$FLOX_ENV_PROJECT/.flox/bin:$GEM_HOME/bin:$PATH"

  mkdir -p "$GEM_HOME" "$BUNDLE_APP_CONFIG" "$FOREM_REDIS_DIR"

  # -- First activation (or a changed lockfile/schema): parallel bootstrap ---
  # Returns almost immediately when nothing changed.
  if [ "${FOREM_BOOTSTRAP:-1}" = 1 ]; then
    "$FLOX_ENV_PROJECT/.flox/bin/forem-bootstrap" --if-needed >&2 || \
      echo "forem-bootstrap failed; logs in $FLOX_ENV_CACHE/bootstrap/" >&2
  fi
'''

[services.postgres]
command = '''
  # shellcheck disable=SC2086  # FOREM_PG_ARGS is a word list on purpose
  exec postgres -D "$PGDATA" $FOREM_PG_ARGS
'''

[services.redis]
command = '''
  # Redis 7.2 exits if setlocale() fails; Nix's glibc lacks host locales on Linux.
  LC_ALL=C exec redis-server --bind 127.0.0.1 --port "$REDIS_PORT" --dir "$FOREM_REDIS_DIR" \
    --save "" --appendonly no
'''

[services.web]
command = '''
  cd "$FLOX_ENV_PROJECT" && exec bin/rails server -p "$PORT" -b 127.0.0.1
'''

[services.sidekiq]
command = '''
  # Flox starts services together; Sidekiq exits if Redis is not up yet.
  until redis-cli -p "$REDIS_PORT" ping >/dev/null 2>&1; do sleep 0.5; done
  cd "$FLOX_ENV_PROJECT" && exec bundle exec sidekiq
'''

[services.js]
command = '''
  cd "$FLOX_ENV_PROJECT" && exec yarn build --watch
'''

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
