# Behind Edge CDN / Load Balancer Destination (`bundle exec kamal setup -d edge` / `bundle exec kamal deploy -d edge`)
#
# Use when Cloudflare (Proxied), Fastly, DigitalOcean Load Balancer, or an upstream Nginx/HAProxy
# terminates public HTTPS and forwards HTTP traffic to kamal-proxy.
#
# Tip: If your Load Balancer health-checks `/up` using the server IP as Host instead of APP_DOMAIN,
# also export KAMAL_PROXY_ANY_HOST=true.

proxy:
  ssl: false
  ssl_redirect: false
  forward_headers: true

env:
  clear:
    APP_PROTOCOL: <%= ENV.fetch("APP_PROTOCOL", "https://").to_s.inspect %>
    FORCE_SSL_IN_RAILS: <%= ENV.fetch("FORCE_SSL_IN_RAILS", "true").to_s.inspect %>
    RAILS_ASSUME_SSL: <%= ENV.fetch("RAILS_ASSUME_SSL", "true").to_s.inspect %>
    # Keep disabled unless your trusted ingress rewrites Host and strips client-supplied X-Forwarded-Host:
    TRUST_X_FORWARDED_HOST: <%= ENV.fetch("TRUST_X_FORWARDED_HOST", "false").to_s.inspect %>
