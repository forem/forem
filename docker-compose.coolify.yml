services:

  postgres:
    image: 'pgvector/pgvector:pg13'
    restart: unless-stopped

    environment:
      POSTGRES_DB: forem_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'

    volumes:
      - 'forem-postgres:/var/lib/postgresql/data'

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U postgres -d forem_production'
      interval: 5s
      timeout: 5s
      retries: 20


  redis:
    image: 'redis:7.0-alpine'
    restart: unless-stopped

    command:
      - redis-server
      - '--requirepass'
      - '${REDIS_PASSWORD}'

    volumes:
      - 'forem-redis:/data'

    healthcheck:
      test:
        - CMD
        - redis-cli
        - '-a'
        - '${REDIS_PASSWORD}'
        - ping
      interval: 5s
      timeout: 3s
      retries: 20


  web:
    build:
      context: .
      dockerfile: Containerfile
      target: production

    restart: unless-stopped

    # TEMPORARY:
    # Keep the Forem container alive while we restore
    # the old database and uploads.
    command:
      - sleep
      - infinity

    environment:
      RAILS_ENV: production
      NODE_ENV: production
      PORT: '3000'
      RAILS_SERVE_STATIC_FILES: 'true'

      APP_DOMAIN: '${APP_DOMAIN}'
      APP_PROTOCOL: '${APP_PROTOCOL}'
      COMMUNITY_NAME: '${COMMUNITY_NAME}'
      DEFAULT_EMAIL: '${DEFAULT_EMAIL}'

      FOREM_OWNER_SECRET: '${FOREM_OWNER_SECRET}'
      SECRET_KEY_BASE: '${SECRET_KEY_BASE}'

      DATABASE_URL: '${DATABASE_URL}'
      DATABASE_POOL_SIZE: '5'
      RAILS_MAX_THREADS: '5'
      WEB_CONCURRENCY: '2'

      REDIS_URL: '${REDIS_URL}'
      REDIS_SIDEKIQ_URL: '${REDIS_SIDEKIQ_URL}'
      REDIS_SESSIONS_URL: '${REDIS_SESSIONS_URL}'
      REDIS_RPUSH_URL: '${REDIS_RPUSH_URL}'

      SESSION_KEY: '${SESSION_KEY}'

    volumes:
      - 'forem-uploads:/opt/apps/forem/public/uploads'

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    expose:
      - '3000'


  sidekiq:
    build:
      context: .
      dockerfile: Containerfile
      target: production

    restart: unless-stopped

    # TEMPORARY:
    # Do not start Sidekiq until the old database has
    # been restored and migrated.
    command:
      - sleep
      - infinity

    environment:
      RAILS_ENV: production
      NODE_ENV: production

      APP_DOMAIN: '${APP_DOMAIN}'
      APP_PROTOCOL: '${APP_PROTOCOL}'
      COMMUNITY_NAME: '${COMMUNITY_NAME}'
      DEFAULT_EMAIL: '${DEFAULT_EMAIL}'

      FOREM_OWNER_SECRET: '${FOREM_OWNER_SECRET}'
      SECRET_KEY_BASE: '${SECRET_KEY_BASE}'

      DATABASE_URL: '${DATABASE_URL}'
      DATABASE_POOL_SIZE: '5'
      RAILS_MAX_THREADS: '5'

      REDIS_URL: '${REDIS_URL}'
      REDIS_SIDEKIQ_URL: '${REDIS_SIDEKIQ_URL}'
      REDIS_SESSIONS_URL: '${REDIS_SESSIONS_URL}'
      REDIS_RPUSH_URL: '${REDIS_RPUSH_URL}'

      SESSION_KEY: '${SESSION_KEY}'

    volumes:
      - 'forem-uploads:/opt/apps/forem/public/uploads'

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  forem-postgres:
  forem-redis:
  forem-uploads:
